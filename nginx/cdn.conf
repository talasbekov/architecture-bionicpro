# Эмуляция CDN: reverse proxy перед MinIO с кешированием готовых отчётов.
proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports_cache:20m
                 max_size=2g inactive=7d use_temp_path=off;

upstream minio_backend {
    server minio:9000;
    keepalive 16;
}

server {
    listen 8081;
    server_name localhost;

    # Ссылки приходят подписанными (SigV4), подпись проверяет MinIO.
    # Поэтому ключ кеша строим только по пути: у разных пользователей пути разные,
    # а повторные обращения к одному отчёту с новой подписью попадают в тот же кеш.
    proxy_cache_key "$uri";

    location /reports/ {
        proxy_pass http://minio_backend;
        proxy_http_version 1.1;

        # MinIO проверяет подпись вместе с заголовком Host, причём вместе с портом.
        # Поэтому именно $http_host, а не $host — последний порт отбрасывает.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache reports_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 403 404 10s;
        # при обновлении витрины меняется путь отчёта, старые объекты вытесняются по inactive
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Content-Disposition 'attachment; filename="bionicpro-report.json"' always;
    }

    # Кеш инвалидируется не сбросом, а сменой пути: в ключ отчёта входит дата,
    # по которую посчитана витрина (reports/<user_id>/<версия витрины>/<период>.json).
    # После очередного прогона ETL сервис отдаёт ссылку с новой версией, старые объекты
    # вытесняются по inactive. Точечный сброс, если понадобится, делается
    # удалением файла из /var/cache/nginx/reports или модулем ngx_cache_purge.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
