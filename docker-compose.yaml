services:
  # ---------- Аутентификация ----------
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/realm.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap

  openldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    ports:
      - "389:389"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      AUTH_REDIRECT_URI: http://localhost:8000/auth/callback
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      REPORTS_API_URL: http://reports-api:8100
      CRM_DSN: postgresql://crm_user:crm_password@crm_db:5432/crm
      SESSION_TTL_SECONDS: "1800"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      ROTATE_SESSION: "true"
      # фиксированный ключ, чтобы сессии переживали перезапуск сервиса
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-Zm9yLWxvY2FsLWRldi1vbmx5LTMyLWJ5dGVzLWtleT0=}
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - keycloak

  # ---------- Данные ----------
  crm_db:
    image: postgres:15
    # логическая репликация нужна Debezium
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - ./crm/init:/docker-entrypoint-initdb.d
      - crm_pgdata:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ---------- Отчёты ----------
  reports-api:
    build:
      context: ./reports-api
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      EXPECTED_ISSUERS: http://localhost:8080/realms/reports-realm,http://keycloak:8080/realms/reports-realm
      REQUIRED_ROLE: prothetic_user
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics_password
      # переключение на витрину, собранную через CDC: user_report_mart_cdc
      REPORT_MART_TABLE: ${REPORT_MART_TABLE:-user_report_mart}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: reports
      CDN_BASE_URL: http://localhost:8081
    ports:
      - "8100:8100"
    depends_on:
      - clickhouse
      - minio

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/reports;
      echo bucket reports готов;
      "

  cdn:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn_cache:/var/cache/nginx
    ports:
      - "8081:8081"
    depends_on:
      - minio

  # ---------- ETL ----------
  airflow:
    image: apache/airflow:2.9.3-python3.11
    command: ["standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://crm_user:crm_password@crm_db:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres==5.11.1 clickhouse-connect==0.7.19
      CRM_DB_HOST: crm_db
      CRM_DB_PORT: "5432"
      CRM_DB_NAME: crm
      CRM_DB_USER: crm_user
      CRM_DB_PASSWORD: crm_password
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/sql:/opt/airflow/sql
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8082:8080"
    depends_on:
      - crm_db
      - clickhouse

  # ---------- CDC ----------
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "9092:9092"

  kafka-connect:
    image: debezium/connect:2.5
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - crm_db

  # ---------- Фронтенд ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

volumes:
  keycloak_pgdata:
  crm_pgdata:
  clickhouse_data:
  minio_data:
  cdn_cache:
  kafka_data:
  airflow_logs:
  ldap_data:
  ldap_config:
